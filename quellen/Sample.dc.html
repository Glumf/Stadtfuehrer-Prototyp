<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Muster-Bildschirm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 300px; height: 640px; box-sizing: border-box; border-radius: 28px; overflow: hidden; background: {{p.bg}}; color: {{p.ink}}; font-family: 'Atkinson Hyperlegible', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 16px 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 36px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: {{p.surface}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></span>
      <span style="font-weight: 700; font-size: 14px">Deine Tour</span>
      <span style="width: 36px; height: 36px; border-radius: 18px; background: {{p.surface}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4"></path><path d="m15.4 6.5-6.8 4"></path></svg></span>
    </div>
    <span style="margin-top: 12px; font-size: 11px; line-height: 14px; color: {{p.muted}}">Für dich zusammengestellt</span>
    <span style="margin-top: 2px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; line-height: 24px">Zeitreise durch die Altstadt</span>
    <span style="margin-top: 4px; font-size: 12px; line-height: 16px; color: {{p.muted}}">2 Std. · 3,4 km · 6 Stopps</span>

    <div style="margin-top: 10px; border-radius: 14px; overflow: hidden">
      <svg aria-hidden="true" width="268" height="130" viewBox="0 0 268 130" style="display: block">
        <rect x="0" y="0" width="268" height="130" fill="{{p.mapBg}}"></rect>
        <rect x="150" y="58" width="44" height="30" rx="8" fill="{{p.park}}"></rect>
        <path d="M-10 18 C 60 36, 120 0, 280 26" stroke="{{p.water}}" stroke-width="14" fill="none"></path>
        <g stroke="{{p.street}}" stroke-width="6" stroke-linecap="round" fill="none">
          <path d="M0 74 H268"></path>
          <path d="M0 118 L268 100"></path>
          <path d="M66 0 V130"></path>
          <path d="M140 0 L152 130"></path>
          <path d="M232 0 L240 130"></path>
        </g>
        <polyline points="46,76 92,100 156,106 222,92 206,52 126,46 46,76" fill="none" stroke="{{p.street}}" stroke-width="6" stroke-linejoin="round"></polyline>
        <polyline points="46,76 92,100 156,106 222,92 206,52 126,46 46,76" fill="none" stroke="{{p.ink}}" stroke-width="2.5" stroke-linejoin="round"></polyline>
        <g font-family="Atkinson Hyperlegible, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
          <circle cx="46" cy="76" r="9" fill="{{p.accent}}" stroke="{{p.primary}}" stroke-width="1.5"></circle>
          <text x="46" y="79.5" fill="{{p.onAccent}}">1</text>
          <circle cx="92" cy="100" r="9" fill="{{p.accent}}" stroke="{{p.primary}}" stroke-width="1.5"></circle>
          <text x="92" y="103.5" fill="{{p.onAccent}}">2</text>
          <circle cx="156" cy="106" r="9" fill="{{p.accent}}" stroke="{{p.primary}}" stroke-width="1.5"></circle>
          <text x="156" y="109.5" fill="{{p.onAccent}}">3</text>
          <circle cx="222" cy="92" r="9" fill="{{p.accent}}" stroke="{{p.primary}}" stroke-width="1.5"></circle>
          <text x="222" y="95.5" fill="{{p.onAccent}}">4</text>
          <circle cx="206" cy="52" r="9" fill="{{p.accent}}" stroke="{{p.primary}}" stroke-width="1.5"></circle>
          <text x="206" y="55.5" fill="{{p.onAccent}}">5</text>
          <circle cx="126" cy="46" r="9" fill="{{p.accent}}" stroke="{{p.primary}}" stroke-width="1.5"></circle>
          <text x="126" y="49.5" fill="{{p.onAccent}}">6</text>
        </g>
      </svg>
    </div>

    <div style="margin-top: 10px; display: flex; gap: 6px">
      <span style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 14px; background: {{p.primary}}; color: {{p.onPrimary}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">Geschichte</span>
      <span style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 14px; background: {{p.surface}}; border: 1px solid {{p.border}}; font-size: 12px; display: flex; align-items: center">Kurioses</span>
      <span style="height: 28px; box-sizing: border-box; padding: 0 10px; border-radius: 14px; background: {{p.surface}}; border: 1px solid {{p.border}}; font-size: 12px; display: flex; align-items: center">+3</span>
    </div>

    <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; background: {{p.surface}}; display: flex; align-items: center; gap: 10px">
        <span style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; background: {{p.accent}}; border: 1.5px solid {{p.primary}}; color: {{p.onAccent}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 700">Alter Marktplatz</span><span style="font-size: 11px; color: {{p.muted}}">Geschichte · 10 Min.</span></span>
      </div>
      <div style="height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; background: {{p.surface}}; display: flex; align-items: center; gap: 10px">
        <span style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; background: {{p.accent}}; border: 1.5px solid {{p.primary}}; color: {{p.onAccent}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 700">Gerberei-Hinterhof</span><span style="font-size: 11px; color: {{p.muted}}">Kurioses · 8 Min.</span></span>
      </div>
    </div>

    <div style="margin-top: auto; padding-top: 12px; display: flex; gap: 8px">
      <span style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1.5px solid {{p.ink}}; background: {{p.surface}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">Neu planen</span>
      <span style="flex: 1.3; height: 44px; border-radius: 22px; background: {{p.accent}}; color: {{p.onAccent}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">Tour starten</span>
    </div>
  </div>

  <div style="flex: none; height: 56px; box-sizing: border-box; padding: 6px 8px 8px; background: {{p.surface}}; border-top: 1px solid {{p.border}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 44px; height: 24px; border-radius: 12px; background: {{p.accent}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"></polygon></svg></span>Entdecken</span>
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: {{p.muted}}"><span style="width: 44px; height: 24px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"></path></svg></span>Touren</span>
    <span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: {{p.muted}}"><span style="width: 44px; height: 24px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>Profil</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pal":{"editor":null},"$preview":{"width":300,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const fallback = { bg: '#EEF1F4', surface: '#FFFFFF', ink: '#14202E', muted: '#4A5768', border: '#C5CDD6', primary: '#14202E', onPrimary: '#FFFFFF', accent: '#F5C518', onAccent: '#14202E', mapBg: '#E2E7EC', street: '#FFFFFF', water: '#B5D0E4', park: '#CFE3C8' };
    return { p: this.props.pal ?? fallback };
  }
}
</script>
</body>
</html>
