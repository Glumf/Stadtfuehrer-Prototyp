html, body { margin: 0; height: 100%; overflow: hidden; background: #D9DEE4; -webkit-text-size-adjust: 100%; }
#stage { position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
#device { flex: none; width: 390px; height: var(--app-h, 844px); overflow: hidden; transform: scale(var(--s, 1)); -webkit-user-select: none; user-select: none; }
#web { position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: none; }
.webmode #stage { display: none; }
.webmode #web { display: block; }
.desk #device { border-radius: 44px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28); }
.phone #stage { display: block; }
.phone #device { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#toWeb { position: fixed; right: 20px; top: 20px; display: none; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #14202E; color: #FFFFFF; font: 700 15px 'Atkinson Hyperlegible', sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); }
button { -webkit-appearance: none; appearance: none; margin: 0; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="stage"><div id="device"></div></div>
<div id="web"></div>
<button type="button" id="toWeb"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>Zur Web-Ansicht</button>
<template id="tpl-app">
<div style="width: 390px; height: 100%; position: relative; overflow: hidden; font-family: 'Atkinson Hyperlegible', sans-serif; background: {{c.bg}}; color: {{c.ink}}">

<sc-if value="{{is.welcome}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; background: {{c.bg}}">
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
    <div style="width: 72px; height: 72px; border-radius: 36px; background: {{c.accent}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{c.onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"></polygon></svg></div>
    <span style="margin-top: 24px; font-size: 15px; font-weight: 700; color: {{c.muted}}">[App-Name]</span>
    <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 44px; letter-spacing: -1px">Deine Stadt, deine Geschichte.</h1>
    <p style="margin: 16px 0 0; font-size: 17px; line-height: 26px; color: {{c.muted}}">Touren, die zu dir passen. Zu Fuß, mit dem Rad, mit Öffis oder dem Auto, erzählt genau dort, wo du gerade bist.</p>

    <sc-if value="{{isFree}}" hint-placeholder-val="{{ false }}">

    <sc-if value="{{isGroup}}" hint-placeholder-val="{{ false }}">

      </div>
    </sc-if>
    <p style="margin: 10px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{whomHint}}</p>
    <sc-if value="{{isGroup}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 10px; padding: 14px; border-radius: 16px; background: {{c.soft}}; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px">

    <h2 style="margin: 20px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 24px">Wie bist du unterwegs?</h2>

      <button type="button" aria-pressed="{{modes.walk.pressed}}" onClick="{{modes.walk.pick}}" style="font: inherit; font-size: 14px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; cursor: pointer; {{modes.walk.st}}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{modes.walk.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M12 7l-1 7"></path><path d="M11 14l-3 7"></path><path d="M11 14l3 3 1 4"></path><path d="M8 11l4-3 3 3 2 1"></path></svg>Zu Fuß</button>
      <button type="button" aria-pressed="{{modes.bike.pressed}}" onClick="{{modes.bike.pick}}" style="font: inherit; font-size: 14px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; cursor: pointer; {{modes.bike.st}}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{modes.bike.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg><span style="text-align: center; line-height: 16px">Rad / <span style="white-space: nowrap">E-Scooter</span></span></button>
      <button type="button" aria-pressed="{{modes.transit.pressed}}" onClick="{{modes.transit.pick}}" style="font: inherit; font-size: 14px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; cursor: pointer; {{modes.transit.st}}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{modes.transit.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16"></path><path d="M8 15h.01"></path><path d="M16 15h.01"></path><path d="m8 18-2 3"></path><path d="m16 18 2 3"></path></svg>Öffis</button>
      <button type="button" aria-pressed="{{modes.car.pressed}}" onClick="{{modes.car.pick}}" style="font: inherit; font-size: 14px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; cursor: pointer; {{modes.car.st}}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{modes.car.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"></path><path d="M3 12h18"></path><path d="M9 17h6"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>Auto</button>
    </div>
    <p style="margin: 10px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{modeHint}}</p>
    <sc-if value="{{isTransit}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 14px; background: {{c.surface}}; border-radius: 16px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Hop-on-Hop-off</span><span style="font-size: 13px; color: {{c.muted}}">Geplante Ausstiege mit kurzer Runde, bevorzugt Linien an Sehenswürdigkeiten vorbei</span></span>
        <button type="button" role="switch" aria-checked="{{hopSw.on}}" aria-label="Hop-on-Hop-off" onClick="{{hopSw.toggle}}" style="flex: none; width: 60px; height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; padding: 3px; display: flex; {{hopSw.track}}"><span style="width: 26px; height: 26px; border-radius: 13px; {{hopSw.knob}}"></span></span></button>
      </div>
    </sc-if>
    <sc-if value="{{showFootKm}}" hint-placeholder-val="{{ false }}">

    <h2 style="margin: 20px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 24px">Tourart</h2>
    <sc-if value="{{showTourTypes}}" hint-placeholder-val="{{ true }}">

      </div>

    </div>

    <h2 style="margin: 20px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 24px">Route</h2>

      <button type="button" aria-pressed="{{routes.ab.pressed}}" onClick="{{routes.ab.pick}}" style="font: inherit; text-align: left; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 16px; cursor: pointer; {{routes.ab.st}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{routes.ab.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14px">Von A nach B</span><span style="font-size: 13px; {{routes.ab.subSt}}">Mit Ziel</span></span></button>
    </div>

    <h2 style="margin: 20px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 24px">Erzählung</h2>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{tourAuds}}" as="a" hint-placeholder-count="4"><button type="button" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}" style="font: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 22px; cursor: pointer; {{a.st}}"><sc-if value="{{a.on}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{a.check}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{a.label}}</button></sc-for>

    </div>

    <h2 style="margin: 20px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 24px">Pausen einplanen</h2>
    <p style="margin: 0 0 10px; font-size: 13px; line-height: 18px; color: {{c.muted}}">Mehrfachauswahl, die Pausen erscheinen in der Vorschau zwischen den Stopps.</p>

    </div>

<sc-if value="{{is.group}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; background: {{c.bg}}">
  <div style="flex: none; height: 60px; box-sizing: border-box; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Zurück" onClick="{{back}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
    <span style="font-weight: 700; font-size: 17px">Einladung</span>
    <span style="width: 44px; height: 44px"></span>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 24px">
    <span style="display: inline-flex; height: 28px; align-items: center; padding: 0 10px; border-radius: 14px; background: {{c.soft}}; font-size: 13px; font-weight: 700">So sieht es bei den Teilnehmern aus</span>
    <h1 style="margin: 14px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 32px; letter-spacing: -0.5px">{{joinTitle}}</h1>
    <p style="margin: 8px 0 0; font-size: 15px; line-height: 22px; color: {{c.muted}}">{{joinMeta}}</p>

      <span style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; font-weight: 700">GL</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">[Gruppenleitung] leitet die Tour</span><span style="font-size: 13px; color: {{c.muted}}">Einstellungen und Route legt die Leitung fest</span></span>
    </div>

    <button type="button" aria-label="Zur Startseite" onClick="{{goHome}}" style="flex: none; display: flex; align-items: center; gap: 10px; font: inherit; border: 0; background: transparent; color: inherit; padding: 0; cursor: pointer">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: {{c.accent}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"></polygon></svg></span>
      <span style="font-weight: 700; font-size: 16px">[App-Name]</span>
    </button>
    <nav aria-label="Hauptnavigation" style="flex: 1; min-width: 0; display: flex; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><button type="button" aria-current="{{n.current}}" onClick="{{n.go}}" style="font: inherit; font-size: 15px; height: 40px; padding: 0 16px; border: 0; border-radius: 20px; cursor: pointer; {{n.st}}">{{n.label}}</button></sc-for>
    </nav>
    <sc-if value="{{isFreePlan}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{goAccount}}" style="flex: none; font: inherit; height: 40px; padding: 0 16px 0 12px; border: 0; border-radius: 20px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 0 0 3px {{c.accent}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="{{c.accent}}" stroke="{{c.accent}}" stroke-width="1.5" stroke-linejoin="round"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg>Premium holen</button></sc-if>
    <button type="button" onClick="{{toApp}}" style="flex: none; font: inherit; font-size: 14px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid {{c.border}}; background: transparent; color: {{c.ink}}; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>App-Ansicht</button>
    <button type="button" aria-label="Konto und Abo" onClick="{{goAccount}}" style="flex: none; width: 40px; height: 40px; border-radius: 20px; border: 0; background: {{c.primary}}; color: {{c.onPrimary}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Du</button>
  </header>

  <div style="flex: 1; min-height: 0; display: flex">

    <sc-if value="{{is.home}}" hint-placeholder-val="{{ false }}">
      <main style="flex: 1; min-width: 0; overflow-y: auto">
        <div style="max-width: 1160px; margin: 0 auto; padding: 32px 40px 48px">
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 38px; letter-spacing: -0.5px">Hallo!</h1>
          <p style="margin: 6px 0 0; color: {{c.muted}}">Wohin geht's als Nächstes?</p>
          <div style="margin-top: 20px; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 20px; align-items: stretch">
            <div style="padding: 26px 28px; border-radius: 22px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; flex-direction: column; gap: 10px">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 32px">Neue Tour planen</span>
              <span style="font-size: 15px; line-height: 22px">Wähle eine Stadt. Auf der großen Karte stellst du dann alles in Ruhe ein und schickst die Tour aufs Handy.</span>
              <span style="margin-top: 6px; font-size: 13px; font-weight: 700">Stadt</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{homeCities}}" as="x" hint-placeholder-count="4"><button type="button" aria-pressed="{{x.pressed}}" onClick="{{x.pick}}" style="font: inherit; font-size: 14px; height: 40px; padding: 0 14px; border-radius: 20px; cursor: pointer; {{x.st}}">{{x.label}}</button></sc-for>
                <button type="button" onClick="{{searchCity}}" style="font: inherit; font-size: 14px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px dashed {{c.onAccent}}; background: transparent; color: {{c.onAccent}}; cursor: pointer">Andere Stadt suchen …</button>
              </div>
              <button type="button" onClick="{{planCity}}" style="margin-top: 8px; align-self: flex-start; font: inherit; font-weight: 700; font-size: 16px; height: 50px; padding: 0 22px; border: 0; border-radius: 25px; background: {{c.primary}}; color: {{c.onPrimary}}; cursor: pointer">Tour planen</button>
            </div>
            <div style="padding: 22px 24px; border-radius: 22px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; flex-direction: column; gap: 8px">
              <span style="align-self: flex-start; height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 13px; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">Saison-Aktion · {{season.until}}</span>
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 28px">{{season.title}}</span>
              <div style="height: 8px; border-radius: 4px; background: rgba(127, 127, 127, 0.35)"><div style="height: 8px; border-radius: 4px; background: {{c.accent}}; width: {{season.pct}}"></div></div>
              <span style="font-size: 14px; font-weight: 700">{{season.progress}}</span>
              <span style="font-size: 14px; line-height: 20px; opacity: 0.85">{{homeCollect}}</span>
              <button type="button" onClick="{{goCollection}}" style="margin-top: auto; align-self: flex-start; font: inherit; font-weight: 700; font-size: 14px; height: 42px; padding: 0 16px; border: 0; border-radius: 21px; background: {{c.accent}}; color: {{c.onAccent}}; cursor: pointer">Zur Sammlung</button>
            </div>
          </div>
          <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start">
            <div style="padding: 20px 24px; border-radius: 20px; background: {{c.surface}}">
              <div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">Geplant</h2><button type="button" onClick="{{goTours}}" style="font: inherit; font-size: 14px; border: 0; background: transparent; color: {{c.ink}}; text-decoration: underline; cursor: pointer">Alle Touren</button></div>
              <p style="margin: 4px 0 6px; font-size: 13px; color: {{c.muted}}">Noch nicht gemacht</p>
              <sc-for list="{{homePlanned}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.open}}" style="font: inherit; text-align: left; width: 100%; min-height: 60px; border: 0; border-bottom: 1px solid {{t.divider}}; background: transparent; color: {{c.ink}}; padding: 8px 0; display: flex; align-items: center; gap: 12px; cursor: pointer"><span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{t.modeShort}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{t.title}}</span><span style="font-size: 13px; color: {{c.muted}}">{{t.meta}}</span></span><sc-if value="{{t.onPhone}}" hint-placeholder-val="{{ false }}"><span style="flex: none; height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 700; display: flex; align-items: center; background: {{c.soft}}">Auf dem Handy</span></sc-if></button></sc-for>
              <sc-if value="{{homeNoPlanned}}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 0 0; font-size: 14px; color: {{c.muted}}">Noch nichts geplant.</p></sc-if>
            </div>
            <div style="padding: 20px 24px; border-radius: 20px; background: {{c.surface}}">
              <div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">Erlebt</h2><button type="button" onClick="{{goTours}}" style="font: inherit; font-size: 14px; border: 0; background: transparent; color: {{c.ink}}; text-decoration: underline; cursor: pointer">Tagebuch</button></div>
              <p style="margin: 4px 0 6px; font-size: 13px; color: {{c.muted}}">Schon gemacht, mit Tagebuch</p>
              <sc-for list="{{homeDone}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.open}}" style="font: inherit; text-align: left; width: 100%; min-height: 60px; border: 0; border-bottom: 1px solid {{t.divider}}; background: transparent; color: {{c.ink}}; padding: 8px 0; display: flex; align-items: center; gap: 12px; cursor: pointer"><span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{t.modeShort}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{t.title}}</span><span style="font-size: 13px; color: {{c.muted}}">{{t.meta}} · {{t.diaryInfo}}</span></span></button></sc-for>
            </div>
          </div>
        </div>
      </main>
    </sc-if>

    <sc-if value="{{is.plan}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Tour planen" style="flex: none; width: 440px; min-height: 0; display: flex; flex-direction: column; background: {{c.bg}}; border-right: 1px solid {{c.divider}}">
        <div style="flex: none; padding: 16px 24px 12px">
          <h1 style="margin: 0 0 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 32px; letter-spacing: -0.4px">Tour vorbereiten</h1>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: {{c.seg}}; border-radius: 14px">
            <button type="button" aria-pressed="{{tabs.settings.pressed}}" onClick="{{tabs.settings.pick}}" style="font: inherit; font-size: 15px; height: 40px; border: 0; border-radius: 10px; cursor: pointer; {{tabs.settings.st}}">Einstellungen</button>
            <button type="button" aria-pressed="{{tabs.stops.pressed}}" onClick="{{tabs.stops.pick}}" style="font: inherit; font-size: 15px; height: 40px; border: 0; border-radius: 10px; cursor: pointer; {{tabs.stops.st}}">{{stopsTabLabel}}</button>
          </div>
        </div>

        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 24px">
          <sc-if value="{{tabSettings}}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{isCustom}}" hint-placeholder-val="{{ false }}">
              <div style="margin: 4px 0 8px; padding: 12px 14px; border-radius: 14px; background: {{c.soft}}; display: flex; flex-direction: column; gap: 8px">
                <span style="font-size: 14px; line-height: 20px">Du hast die Stopps von Hand angepasst. Änderungen hier wirken erst, wenn du neu vorschlagen lässt.</span>
                <button type="button" onClick="{{resetPlan}}" style="align-self: flex-start; font: inherit; font-size: 14px; font-weight: 700; height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid {{c.ink}}; background: transparent; color: {{c.ink}}; cursor: pointer">Neu vorschlagen</button>
              </div>
            </sc-if>

            <h2 style="margin: 12px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; line-height: 24px">Wohin und wann?</h2>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button type="button" onClick="{{pickCity}}" style="font: inherit; text-align: left; height: 56px; padding: 0 12px; border-radius: 12px; border: 1.5px solid {{c.border}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer"><span style="font-size: 12px; color: {{c.muted}}">Stadt</span><span style="font-weight: 700; font-size: 15px">{{cityName}}</span></button>
              <button type="button" onClick="{{pickStart}}" style="font: inherit; text-align: left; height: 56px; padding: 0 12px; border-radius: 12px; border: 1.5px solid {{c.border}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer"><span style="font-size: 12px; color: {{c.muted}}">Start</span><span style="font-weight: 700; font-size: 15px">Hauptbahnhof</span></button>
            </div>
            <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{whens}}" as="w" hint-placeholder-count="4"><button type="button" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}" style="font: inherit; font-size: 14px; height: 40px; padding: 0 12px; border-radius: 20px; cursor: pointer; {{w.st}}">{{w.label}}</button></sc-for>
            </div>
            <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{weatherHint}}</p>

            <h2 style="margin: 22px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; line-height: 24px">Für wen ist die Tour?</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{whom}}" as="w" hint-placeholder-count="6"><button type="button" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}" style="font: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 20px; cursor: pointer; {{w.st}}"><sc-if value="{{w.on}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{w.check}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{w.label}}</button></sc-for>
            </div>
            <sc-if value="{{isFree}}" hint-placeholder-val="{{ false }}">
              <span style="display: block; margin: 12px 0 8px; font-size: 13px; color: {{c.muted}}">Interessen nur für diese Tour</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{freeInts}}" as="i" hint-placeholder-count="9"><button type="button" aria-pressed="{{i.pressed}}" onClick="{{i.toggle}}" style="font: inherit; font-size: 14px; height: 40px; padding: 0 12px; border-radius: 20px; cursor: pointer; {{i.st}}">{{i.label}}</button></sc-for>
              </div>
            </sc-if>
            <sc-if value="{{isGroup}}" hint-placeholder-val="{{ false }}">
              <span style="display: block; margin: 12px 0 8px; font-size: 13px; color: {{c.muted}}">Interessen der Gruppe</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{groupInts}}" as="i" hint-placeholder-count="9"><button type="button" aria-pressed="{{i.pressed}}" onClick="{{i.toggle}}" style="font: inherit; font-size: 14px; height: 40px; padding: 0 12px; border-radius: 20px; cursor: pointer; {{i.st}}">{{i.label}}</button></sc-for>
              </div>
            </sc-if>
            <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{whomHint}}</p>
            <sc-if value="{{isGroup}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: {{c.soft}}; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 20px">
                <span style="font-weight: 700">Du leitest die Gruppe</span>
                <span>Nur du legst die Einstellungen fest und teilst danach einen Link. Die anderen brauchen nur die App, kein Konto, und die Tour ist für sie kostenlos. Unterwegs startest du für alle und kannst die Route noch ändern.</span>
              </div>
            </sc-if>

            <h2 style="margin: 22px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; line-height: 24px">Unterwegs mit</h2>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
              <button type="button" aria-pressed="{{modes.walk.pressed}}" onClick="{{modes.walk.pick}}" style="font: inherit; font-size: 13px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 14px; cursor: pointer; {{modes.walk.st}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{modes.walk.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M12 7l-1 7"></path><path d="M11 14l-3 7"></path><path d="M11 14l3 3 1 4"></path><path d="M8 11l4-3 3 3 2 1"></path></svg>Zu Fuß</button>
              <button type="button" aria-pressed="{{modes.bike.pressed}}" onClick="{{modes.bike.pick}}" style="font: inherit; font-size: 13px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 14px; cursor: pointer; {{modes.bike.st}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{modes.bike.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg><span style="text-align: center; line-height: 15px">Rad / <span style="white-space: nowrap">E-Scooter</span></span></button>
              <button type="button" aria-pressed="{{modes.transit.pressed}}" onClick="{{modes.transit.pick}}" style="font: inherit; font-size: 13px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 14px; cursor: pointer; {{modes.transit.st}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{modes.transit.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16"></path><path d="M8 15h.01"></path><path d="M16 15h.01"></path><path d="m8 18-2 3"></path><path d="m16 18 2 3"></path></svg>Öffis</button>
              <button type="button" aria-pressed="{{modes.car.pressed}}" onClick="{{modes.car.pick}}" style="font: inherit; font-size: 13px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 14px; cursor: pointer; {{modes.car.st}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{modes.car.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"></path><path d="M3 12h18"></path><path d="M9 17h6"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle></svg>Auto</button>
            </div>
            <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{modeHint}}</p>
            <sc-if value="{{isTransit}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 8px; display: flex; align-items: center; gap: 12px; padding: 4px 8px 4px 14px; background: {{c.surface}}; border-radius: 16px">
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Hop-on-Hop-off</span><span style="font-size: 13px; color: {{c.muted}}">Geplante Ausstiege mit kurzer Runde, bevorzugt Linien an Sehenswürdigkeiten vorbei</span></span>
                <button type="button" role="switch" aria-checked="{{hopSw.on}}" aria-label="Hop-on-Hop-off" onClick="{{hopSw.toggle}}" style="flex: none; width: 60px; height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 48px; height: 28px; box-sizing: border-box; border-radius: 14px; padding: 3px; display: flex; {{hopSw.track}}"><span style="width: 22px; height: 22px; border-radius: 11px; {{hopSw.knob}}"></span></span></button>
              </div>
            </sc-if>
            <sc-if value="{{showFootKm}}" hint-placeholder-val="{{ false }}">
              <div style="margin: 12px 0 4px; display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; color: {{c.muted}}">Zu Fuß unterwegs</span><span style="font-size: 15px; font-weight: 700">{{footKmLabel}}</span></div>
              <input type="range" min="0" max="10" step="0.5" value="{{footKm}}" onChange="{{setFootKm}}" aria-label="Strecke zu Fuß in Kilometern" style="width: 100%; height: 30px; margin: 0; accent-color: {{c.primary}}">
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{c.muted}}"><span>Keine</span><span>10 km</span></div>
              <p style="margin: 6px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{footKmHint}}</p>
            </sc-if>
            <span style="display: block; margin: 14px 0 6px; font-size: 13px; color: {{c.muted}}">Tourart</span>
            <sc-if value="{{showTourTypes}}" hint-placeholder-val="{{ true }}">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: {{c.seg}}; border-radius: 14px">
                <sc-for list="{{tourTypes}}" as="t" hint-placeholder-count="2"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="font: inherit; font-size: 14px; height: 40px; border: 0; border-radius: 10px; cursor: pointer; {{t.st}}">{{t.label}}</button></sc-for>
              </div>
              <p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{tourTypeHint}}</p>
            </sc-if>
            <sc-if value="{{autoTourType}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: {{c.surface}}">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
                <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Tourart automatisch</span><span style="font-size: 14px; line-height: 20px; color: {{c.muted}}">{{autoTypeHint}}</span></span>
              </div>
            </sc-if>

            <h2 style="margin: 22px 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; line-height: 24px">Dauer, Tempo und Route</h2>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: {{c.seg}}; border-radius: 14px">
